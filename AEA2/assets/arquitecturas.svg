<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Dos arquitecturas para el portal</title><desc id="desc">El portal estático sirve archivos. La evolución dinámica ejecuta código y consulta datos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f32c9"/></marker></defs><rect width="1100" height="440" rx="20" fill="#fff3f0"/><style>text{font-family:system-ui,sans-serif;fill:#29163e}.label{font-size:23px;font-weight:700}.small{font-size:19px}.arrow{stroke:#6f32c9;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbb3df;stroke-width:2}</style><text class="label" x="35" y="44">Portal estático</text><rect class="box" x="35" y="70" width="230" height="90" rx="14"/><text class="label" x="150.0" y="106" text-anchor="middle">Navegador</text><text class="small" x="150.0" y="135" text-anchor="middle">Interpreta HTML/CSS</text><line class="arrow" x1="275" y1="115" x2="395" y2="115"/><rect class="box" x="410" y="70" width="250" height="90" rx="14"/><text class="label" x="535.0" y="106" text-anchor="middle">Servidor web</text><text class="small" x="535.0" y="135" text-anchor="middle">Apache</text><line class="arrow" x1="675" y1="115" x2="790" y2="115"/><rect class="box" x="805" y="70" width="260" height="90" rx="14"/><text class="label" x="935.0" y="106" text-anchor="middle">Archivos</text><text class="small" x="935.0" y="135" text-anchor="middle">HTML + CSS</text><text class="label" x="35" y="240">Evolución dinámica</text><rect class="box" x="35" y="270" width="230" height="90" rx="14"/><text class="label" x="150.0" y="306" text-anchor="middle">Navegador</text><text class="small" x="150.0" y="335" text-anchor="middle">Recibe HTML generado</text><line class="arrow" x1="275" y1="315" x2="395" y2="315"/><rect class="box" x="410" y="270" width="250" height="90" rx="14"/><text class="label" x="535.0" y="306" text-anchor="middle">Apache + PHP</text><text class="small" x="535.0" y="335" text-anchor="middle">Ejecuta y calcula</text><line class="arrow" x1="675" y1="315" x2="790" y2="315"/><rect class="box" x="805" y="270" width="260" height="90" rx="14"/><text class="label" x="935.0" y="306" text-anchor="middle">MariaDB</text><text class="small" x="935.0" y="335" text-anchor="middle">Conserva resultados</text><text class="small" x="35" y="412">Cada fila puede ejecutarse en un solo ordenador; las flechas representan comunicación.</text></svg>