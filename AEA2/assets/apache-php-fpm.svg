<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Apache y PHP-FPM</title><desc id="desc">El navegador solicita PHP a Apache, que encarga la ejecución a FPM. El resultado HTML vuelve al navegador y el CSS se sirve directamente.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f32c9"/></marker></defs><rect width="1000" height="380" rx="20" fill="#fff3f0"/><style>text{font-family:system-ui,sans-serif;fill:#29163e}.box{fill:white;stroke:#cfb7e7;stroke-width:2}.title{font-size:25px;font-weight:700}.small{font-size:19px}.arrow{stroke:#6f32c9;stroke-width:3;marker-end:url(#arrow)}</style><rect class="box" x="30" y="120" width="230" height="110" rx="14"/><rect class="box" x="385" y="120" width="230" height="110" rx="14"/><rect class="box" x="740" y="120" width="230" height="110" rx="14"/><text class="title" x="145" y="165" text-anchor="middle">Navegador</text><text class="small" x="145" y="199" text-anchor="middle">Interpreta HTML</text><text class="title" x="500" y="165" text-anchor="middle">Apache</text><text class="small" x="500" y="199" text-anchor="middle">Atiende HTTP</text><text class="title" x="855" y="165" text-anchor="middle">PHP-FPM</text><text class="small" x="855" y="199" text-anchor="middle">Ejecuta index.php</text><path class="arrow" d="M260 145H380"/><text class="small" x="310" y="108" text-anchor="middle">HTTP</text><path class="arrow" d="M615 145H735"/><text class="small" x="675" y="108" text-anchor="middle">FastCGI</text><path class="arrow" d="M740 211H620"/><path class="arrow" d="M385 211H265"/><text class="small" x="670" y="256" text-anchor="middle">HTML generado</text><text class="small" x="315" y="256" text-anchor="middle">Respuesta</text><text class="small" x="40" y="332">El CSS sigue siendo un recurso estático. Los datos de esta etapa están en el código PHP.</text></svg>