<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Una página puede generar varias peticiones</title><desc id="desc">GET del documento y GET del CSS son independientes; cada respuesta tiene su estado.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f32c9"/></marker></defs><rect width="1100" height="440" rx="20" fill="#fff3f0"/><style>text{font-family:system-ui,sans-serif;fill:#29163e}.label{font-size:23px;font-weight:700}.small{font-size:19px}.arrow{stroke:#6f32c9;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbb3df;stroke-width:2}</style><rect class="box" x="40" y="170" width="240" height="90" rx="14"/><text class="label" x="160.0" y="206" text-anchor="middle">Navegador</text><text class="small" x="160.0" y="235" text-anchor="middle">Pide y representa</text><rect class="box" x="820" y="170" width="240" height="90" rx="14"/><text class="label" x="940.0" y="206" text-anchor="middle">Servidor web</text><text class="small" x="940.0" y="235" text-anchor="middle">Lee y responde</text><line class="arrow" x1="300" y1="95" x2="800" y2="95"/><line class="arrow" x1="800" y1="145" x2="300" y2="145"/><line class="arrow" x1="300" y1="280" x2="800" y2="280"/><line class="arrow" x1="800" y1="330" x2="300" y2="330"/><text class="small" x="405" y="80">1 · GET /index.html</text><text class="small" x="355" y="180">200 · cabeceras + cuerpo HTML</text><text class="small" x="405" y="265">2 · GET /style.css</text><text class="small" x="355" y="365">200 · cabeceras + cuerpo CSS</text><text class="small" x="45" y="420">Una ruta CSS incorrecta puede devolver 404 aunque el documento HTML haya respondido 200.</text></svg>