<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Puertos, red y persistencia</title><desc id="desc">El navegador accede al puerto 8081 del anfitrión; PHP consulta db:3306 y MariaDB utiliza un volumen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6f32c9"/></marker></defs><rect width="1100" height="440" rx="20" fill="#fff3f0"/><style>text{font-family:system-ui,sans-serif;fill:#29163e}.label{font-size:23px;font-weight:700}.small{font-size:19px}.arrow{stroke:#6f32c9;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbb3df;stroke-width:2}</style><rect class="box" x="25" y="70" width="230" height="90" rx="14"/><text class="label" x="140.0" y="106" text-anchor="middle">Navegador</text><text class="small" x="140.0" y="135" text-anchor="middle">127.0.0.1:8081</text><line class="arrow" x1="265" y1="115" x2="370" y2="115"/><rect class="box" x="385" y="70" width="270" height="90" rx="14"/><text class="label" x="520.0" y="106" text-anchor="middle">web · puerto 80</text><text class="small" x="520.0" y="135" text-anchor="middle">Apache + PHP</text><line class="arrow" x1="670" y1="115" x2="790" y2="115"/><rect class="box" x="805" y="70" width="270" height="90" rx="14"/><text class="label" x="940.0" y="106" text-anchor="middle">db · puerto 3306</text><text class="small" x="940.0" y="135" text-anchor="middle">MariaDB</text><text class="small" x="285" y="82">publica</text><text class="small" x="690" y="82">red interna</text><line class="arrow" x1="940" y1="175" x2="940" y2="245"/><rect class="box" x="805" y="260" width="270" height="90" rx="14"/><text class="label" x="940.0" y="296" text-anchor="middle">Volumen dades</text><text class="small" x="940.0" y="325" text-anchor="middle">Persistencia</text><text class="label" x="35" y="275">localhost depende de dónde estés</text><text class="small" x="35" y="320">En el navegador: tu ordenador.</text><text class="small" x="35" y="355">Dentro de web: el propio contenedor web.</text><text class="small" x="35" y="390">Por eso PHP conecta a db, no a localhost.</text></svg>